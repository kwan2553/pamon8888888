<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Notes - แอปบันทึกโน้ตอัจฉริยะ (Auto-save)</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary-color: #4a90e2;
            --text-color: #333333;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Sarabun', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            color: #2c3e50;
            font-size: 2rem;
            margin-bottom: 5px;
        }

        /* Form Area */
        .note-form {
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            transition: all 0.3s ease;
        }

        .input-group {
            margin-bottom: 12px;
        }

        input[type="text"], textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }

        input[type="text"]:focus, textarea:focus, select:focus {
            border-color: var(--primary-color);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
        }

        .color-picker {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .color-option {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .color-option.selected {
            border-color: #333;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn {
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: background 0.2s;
        }

        .btn-cancel { background: #e0e0e0; color: #666; display: none; }
        .btn-cancel:hover { background: #d0d0d0; }

        .auto-save-status {
            font-size: 12px;
            color: #27ae60;
            display: none;
            align-items: center;
            gap: 5px;
        }

        /* Search & Filter Bar */
        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .search-container input {
            flex: 2;
            min-width: 200px;
        }

        .search-container select {
            flex: 1;
            min-width: 150px;
        }

        /* Notes Grid */
        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 18px;
        }

        .note-card {
            border-radius: var(--border-radius);
            padding: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            word-wrap: break-word;
            border-top: 5px solid #ccc;
        }

        .note-card.pinned {
            box-shadow: 0 4px 12px rgba(241, 196, 15, 0.3);
        }

        .pin-badge {
            position: absolute;
            top: 10px;
            right: 12px;
            color: #f39c12;
            font-size: 16px;
        }

        .note-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
            padding-right: 20px;
        }

        .note-category {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(0,0,0,0.05);
            border-radius: 12px;
            font-size: 0.75rem;
            color: #555;
            margin-bottom: 10px;
            width: fit-content;
        }

        .note-content {
            font-size: 0.95rem;
            color: #444;
            white-space: pre-wrap;
            margin-bottom: 15px;
            flex-grow: 1;
        }

        .note-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(0,0,0,0.05);
            padding-top: 10px;
            font-size: 0.75rem;
            color: #888;
        }

        .card-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #666;
            font-size: 14px;
            transition: color 0.2s;
        }

        .action-btn:hover { color: var(--primary-color); }
        .action-btn.delete:hover { color: #e74c3c; }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: #999;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1><i class="fa-solid fa-note-sticky"></i> Smart Notes</h1>
        <p>บันทึก จัดหมวดหมู่ และปักหมุดโน้ตสำคัญของคุณ (ระบบบันทึกอัตโนมัติ)</p>
    </header>

    <!-- ฟอร์มสร้าง/แก้ไขโน้ต -->
    <div class="note-form" id="form-container">
        <input type="hidden" id="note-id">
        <div class="input-group">
            <input type="text" id="note-title" placeholder="หัวข้อโน้ต..." oninput="autoSaveNote()">
        </div>
        <div class="input-group">
            <textarea id="note-content" placeholder="พิมพ์เนื้อหาโน้ตของคุณที่นี่..." oninput="autoSaveNote()"></textarea>
        </div>
        
        <div class="form-controls">
            <!-- ตัวเลือกหมวดหมู่ -->
            <select id="note-category" style="width: auto;" onchange="autoSaveNote()">
                <option value="ทั่วไป">หมวดหมู่: ทั่วไป</option>
                <option value="งาน">หมวดหมู่: งาน</option>
                <option value="ส่วนตัว">หมวดหมู่: ส่วนตัว</option>
                <option value="เรียน">หมวดหมู่: เรียน</option>
            </select>

            <!-- ตัวเลือกสีการ์ด -->
            <div class="color-picker">
                <span style="font-size: 12px; color: #666;">สี:</span>
                <div class="color-option selected" style="background: #ffffff;" data-color="#ffffff" onclick="selectColor(this)"></div>
                <div class="color-option" style="background: #fff3cd;" data-color="#fff3cd" onclick="selectColor(this)"></div>
                <div class="color-option" style="background: #d1e7dd;" data-color="#d1e7dd" onclick="selectColor(this)"></div>
                <div class="color-option" style="background: #cff4fc;" data-color="#cff4fc" onclick="selectColor(this)"></div>
                <div class="color-option" style="background: #f8d7da;" data-color="#f8d7da" onclick="selectColor(this)"></div>
            </div>

            <!-- สถานะ Auto-save และปุ่มล้างฟอร์ม -->
            <div class="btn-group">
                <span class="auto-save-status" id="save-status"><i class="fa-solid fa-check"></i> บันทึกแล้ว</span>
                <button class="btn btn-cancel" id="cancel-btn" onclick="resetForm()">เสร็จสิ้น / สร้างโน้ตใหม่</button>
            </div>
        </div>
    </div>

    <!-- แถบค้นหาและกรองข้อมูล -->
    <div class="search-container">
        <input type="text" id="search-input" placeholder="🔍 ค้นหาตามหัวข้อหรือเนื้อหา..." oninput="renderNotes()">
        <select id="filter-category" onchange="renderNotes()">
            <option value="ทั้งหมด">แสดงทุกหมวดหมู่</option>
            <option value="ทั่วไป">ทั่วไป</option>
            <option value="งาน">งาน</option>
            <option value="ส่วนตัว">ส่วนตัว</option>
            <option value="เรียน">เรียน</option>
        </select>
    </div>

    <!-- พื้นที่แสดงโน้ต -->
    <div class="notes-grid" id="notes-container"></div>
</div>

<script>
    let notes = JSON.parse(localStorage.getItem('smart_notes_app')) || [];
    let selectedColor = '#ffffff';
    let currentWorkingId = null;

    function selectColor(element) {
        document.querySelectorAll('.color-option').forEach(el => el.classList.remove('selected'));
        element.classList.add('selected');
        selectedColor = element.getAttribute('data-color');
        autoSaveNote();
    }

    function autoSaveNote() {
        const title = document.getElementById('note-title').value.trim();
        const content = document.getElementById('note-content').value.trim();
        const category = document.getElementById('note-category').value;

        if (!title && !content) return;

        const now = new Date();
        const timeString = `${now.toLocaleDateString('th-TH')} ${now.toLocaleTimeString('th-TH', {hour: '2-digit', minute:'2-digit'})}`;

        if (currentWorkingId) {
            notes = notes.map(note => {
                if (note.id == currentWorkingId) {
                    return { ...note, title: title || 'ไม่มีหัวข้อ', content, category, color: selectedColor, updatedAt: timeString };
                }
                return note;
            });
        } else {
            currentWorkingId = Date.now();
            document.getElementById('note-id').value = currentWorkingId;
            document.getElementById('cancel-btn').style.display = 'inline-block';

            const newNote = {
                id: currentWorkingId,
                title: title || 'ไม่มีหัวข้อ',
                content,
                category,
                color: selectedColor,
                isPinned: false,
                createdAt: timeString,
                updatedAt: null
            };
            notes.unshift(newNote);
        }

        saveToLocalStorage();
        renderNotes();
        showSaveStatus();
    }

    function showSaveStatus() {
        const statusEl = document.getElementById('save-status');
        statusEl.style.display = 'inline-flex';
        setTimeout(() => {
            statusEl.style.display = 'none';
        }, 1500);
    }

    function renderNotes() {
        const container = document.getElementById('notes-container');
        const searchText = document.getElementById('search-input').value.toLowerCase();
        const filterCat = document.getElementById('filter-category').value;

        container.innerHTML = '';

        let filtered = notes.filter(note => {
            const matchSearch = note.title.toLowerCase().includes(searchText) || note.content.toLowerCase().includes(searchText);
            const matchCat = filterCat === 'ทั้งหมด' || note.category === filterCat;
            return matchSearch && matchCat;
        });

        filtered.sort((a, b) => b.isPinned - a.isPinned);

        if (filtered.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fa-regular fa-folder-open" style="font-size: 40px; margin-bottom: 10px;"></i>
                    <p>ไม่พบโน้ตในระบบ</p>
                </div>`;
            return;
        }

        filtered.forEach(note => {
            const card = document.createElement('div');
            card.className = `note-card ${note.isPinned ? 'pinned' : ''}`;
            card.style.backgroundColor = note.color;
            card.style.borderTopColor = note.isPinned ? '#f39c12' : '#ccc';

            card.innerHTML = `
                ${note.isPinned ? '<div class="pin-badge"><i class="fa-solid fa-thumbtack"></i></div>' : ''}
                <div>
                    <div class="note-title">${escapeHTML(note.title)}</div>
                    <span class="note-category">${note.category}</span>
                    <div class="note-content">${escapeHTML(note.content)}</div>
                </div>
                <div class="note-footer">
                    <span>${note.updatedAt ? 'แก้ไขล่าสุด: ' + note.updatedAt : note.createdAt}</span>
                    <div class="card-actions">
                        <button class="action-btn" onclick="togglePin(${note.id})" title="${note.isPinned ? 'ยกเลิกการปักหมุด' : 'ปักหมุด'}">
                            <i class="fa-solid fa-thumbtack" style="color: ${note.isPinned ? '#f39c12' : '#aaa'}"></i>
                        </button>
                        <button class="action-btn" onclick="exportNote(${note.id})" title="ดาวน์โหลดไฟล์ .txt">
                            <i class="fa-solid fa-download"></i>
                        </button>
                        <button class="action-btn" onclick="editNote(${note.id})" title="แก้ไข">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button class="action-btn delete" onclick="deleteNote(${note.id})" title="ลบ">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function editNote(id) {
        const note = notes.find(n => n.id === id);
        if (note) {
            currentWorkingId = note.id;
            document.getElementById('note-id').value = note.id;
            document.getElementById('note-title').value = note.title;
            document.getElementById('note-content').value = note.content;
            document.getElementById('note-category').value = note.category;
            
            document.querySelectorAll('.color-option').forEach(el => {
                if (el.getAttribute('data-color') === note.color) {
                    selectColor(el);
                }
            });

            document.getElementById('cancel-btn').style.display = 'inline-block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    function resetForm() {
        currentWorkingId = null;
        document.getElementById('note-id').value = '';
        document.getElementById('note-title').value = '';
        document.getElementById('note-content').value = '';
        document.getElementById('cancel-btn').style.display = 'none';
        
        selectColor(document.querySelector('.color-option[data-color="#ffffff"]'));
    }

    function togglePin(id) {
        notes = notes.map(note => note.id === id ? { ...note, isPinned: !note.isPinned } : note);
        saveToLocalStorage();
        renderNotes();
    }

    function deleteNote(id) {
        if (confirm('คุณแน่ใจหรือไม่ว่าต้องการลบโน้ตนี้?')) {
            notes = notes.filter(note => note.id !== id);
            if (currentWorkingId === id) resetForm();
            saveToLocalStorage();
            renderNotes();
        }
    }

    // แก้ไขระบบดาวน์โหลดภาษาไทย (UTF-8 BOM)
    function exportNote(id) {
        const note = notes.find(n => n.id === id);
        if (!note) return;

        // เติม \uFEFF บังคับให้อ่านภาษาไทยถูกต้อง
        const textContent = `\uFEFFหัวข้อ: ${note.title}\nหมวดหมู่: ${note.category}\nสร้างเมื่อ: ${note.createdAt}\n-----------------------------------\n\n${note.content}`;
        const blob = new Blob([textContent], { type: 'text/plain;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `${note.title.replace(/[/\\?%*:|"<>]/g, '_')}.txt`;
        link.click();
    }

    function saveToLocalStorage() {
        localStorage.setItem('smart_notes_app', JSON.stringify(notes));
    }

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, 
            tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag)
        );
    }

    renderNotes();
</script>

</body>
</html>
